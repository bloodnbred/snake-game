<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e26;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --food: #f87171;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }
  .wrap { width: 100%; max-width: 420px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .stat span { color: var(--muted); }
  .stat b { color: var(--accent); font-weight: 600; }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: var(--panel);
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    background: rgba(18, 20, 26, 0.88);
    backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: 22px; letter-spacing: 2px; }
  .overlay p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .overlay .final { font-size: 15px; color: var(--text); }
  .overlay .final b { color: var(--accent); }
  kbd {
    background: #2a2e3a;
    border: 1px solid #3a3f4d;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 2px 6px;
    font: inherit;
    font-size: 11px;
  }
  footer {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }
  .pad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 64px);
    gap: 8px;
    margin-top: 12px;
  }
  .pad button {
    background: var(--panel);
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    user-select: none;
  }
  .pad button:active { background: #262a35; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stat">SCORE <b id="score">0</b></div>
    <div class="stat">BEST <b id="best">0</b></div>
  </header>

  <div class="board">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title">SNAKE</h1>
      <p id="msg">
        <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer<br>
        <kbd>Space</kbd> to pause
      </p>
      <p class="final" id="final" hidden></p>
    </div>
  </div>

  <div class="pad">
    <button class="up" data-dir="up">&uarr;</button>
    <button class="left" data-dir="left">&larr;</button>
    <button class="down" data-dir="down">&darr;</button>
    <button class="right" data-dir="right">&rarr;</button>
  </div>

  <footer>
    <span>eat to grow</span>
    <span id="speed">speed 1</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const COLS = 20;
  const ROWS = 20;
  const CELL = 20; // canvas is COLS*CELL square

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const finalEl = document.getElementById('final');

  const START_TICKS = 9;   // ~7 moves/sec
  const MIN_TICKS = 4;     // speed cap
  const SPEEDUP = 2;       // score gained per level

  let snake, dir, pendingDir, food, score, best, tick, tickRate, alive, paused, level;

  best = Number(localStorage.getItem('snake.best') || 0) || 0;
  bestEl.textContent = best;

  const rand = (n) => Math.floor(Math.random() * n);

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    return free.length ? free[rand(free.length)] : null;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    pendingDir = dir;
    score = 0;
    level = 1;
    tick = 0;
    tickRate = START_TICKS;
    alive = true;
    paused = false;
    food = placeFood();
    scoreEl.textContent = '0';
    speedEl.textContent = 'speed 1';
    // Clear any stale overlay text from a previous run.
    titleEl.textContent = 'SNAKE';
    msgEl.innerHTML =
      '<kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or ' +
      '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer<br>' +
      '<kbd>Space</kbd> to pause';
    overlay.hidden = true;
  }

  function step() {
    dir = pendingDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return die();
    // self (tail cell is vacated on non-eating moves, so ignore last segment)
    const body = snake.slice(0, -1);
    if (body.some((s) => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake.best', String(best));
      }
      if (score % SPEEDUP === 0) {
        level += 1;
        tickRate = Math.max(MIN_TICKS, START_TICKS - level);
        speedEl.textContent = 'speed ' + level;
      }
      food = placeFood();
      if (!food) return win(); // board full
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    showOverlay('GAME OVER', `score <b>${score}</b> &middot; best <b>${best}</b><br>press <kbd>Space</kbd> or tap to retry`);
  }

  function win() {
    alive = false;
    showOverlay('YOU WIN', `perfect run &middot; score <b>${score}</b><br>press <kbd>Space</kbd> or tap to play again`);
  }

  function showOverlay(title, msg) {
    titleEl.textContent = title;
    msgEl.innerHTML = msg;
    finalEl.hidden = true;
    overlay.hidden = false;
  }

  function draw() {
    ctx.fillStyle = '#1b1e26';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, canvas.height);
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(canvas.width, i * CELL + 0.5);
    }
    ctx.stroke();

    if (food) {
      ctx.fillStyle = '#f87171';
      roundRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8, 4);
      ctx.fill();
    }

    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      ctx.fillStyle = i === 0
        ? '#4ade80'
        : `hsl(142, ${64 - t * 30}%, ${58 - t * 22}%)`;
      roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
    });

    if (paused && alive) {
      ctx.fillStyle = 'rgba(18,20,26,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '600 20px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function turn(x, y) {
    // reject 180° reversals and same-direction repeats
    if (dir.x === -x && dir.y === -y) return;
    if (dir.x === x && dir.y === y) return;
    pendingDir = { x, y };
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  window.addEventListener('keydown', (e) => {
    if (e.key in KEYS) {
      e.preventDefault();
      const [x, y] = KEYS[e.key];
      if (alive) turn(x, y);
      return;
    }
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (alive) {
        paused = !paused;
        if (paused) { titleEl.textContent = 'PAUSED'; msgEl.innerHTML = 'press <kbd>Space</kbd> to resume'; overlay.hidden = false; }
        else overlay.hidden = true;
      } else {
        reset();
        overlay.hidden = true;
      }
    }
  });

  canvas.addEventListener('click', () => {
    if (!alive) { reset(); overlay.hidden = true; }
  });

  document.querySelectorAll('.pad button').forEach((b) => {
    const fire = (e) => {
      e.preventDefault();
      if (!alive) { reset(); overlay.hidden = true; return; }
      if (paused) { paused = false; overlay.hidden = true; }
      const [x, y] = DIRS[b.dataset.dir];
      turn(x, y);
    };
    b.addEventListener('touchstart', fire, { passive: false });
    b.addEventListener('mousedown', fire);
  });

  // swipe
  let tsx = 0, tsy = 0;
  canvas.addEventListener('touchstart', (e) => {
    tsx = e.touches[0].clientX;
    tsy = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tsx;
    const dy = e.changedTouches[0].clientY - tsy;
    if (Math.hypot(dx, dy) < 24) { if (!alive) { reset(); overlay.hidden = true; } return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  }, { passive: true });

  function loop() {
    if (alive && !paused) {
      tick++;
      if (tick >= tickRate) {
        tick = 0;
        step();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  // reset() hides the overlay for a mid-game restart, but on first load the
  // start screen should be visible with the game paused until the player acts.
  paused = true;
  showOverlay('SNAKE',
    '<kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or ' +
    '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer<br>' +
    '<kbd>Space</kbd> or tap to start');
  loop();
})();
</script>
</body>
</html>
